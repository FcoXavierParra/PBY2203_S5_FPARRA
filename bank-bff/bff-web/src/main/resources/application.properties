spring.application.name=bff-web
server.port=8081

# ---------------------------------------------------------------------------
# Base de datos
# ---------------------------------------------------------------------------
# Cada BFF levanta su propia H2 en memoria y la puebla con el dataset oficial al
# arrancar. Es lo que permite que un revisor clone el repositorio y ejecute las
# tres aplicaciones sin instalar nada.
#
# En un despliegue real los tres apuntarian a la misma base -la que dejo poblada
# el batch de la Experiencia 1-; el perfil 'oracle' de ese proyecto sirve de
# referencia. Compartir el origen de datos NO rompe el patron: lo que BFF separa
# es la capa que sirve a cada frontend, no el almacenamiento.
spring.datasource.url=jdbc:h2:mem:bffweb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Dataset oficial
# ---------------------------------------------------------------------------
# Ruta bajo classpath con los CSV de data/semana_3 del repositorio oficial
# bank_legacy_data. Es el valor POR DEFECTO a proposito: en la entrega anterior
# los datos oficiales quedaron detras de un parametro que habia que cambiar a
# mano, y esa fue la principal observacion del docente.
bank.datos.ruta=data

logging.level.cl.duoc.bank=INFO

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
# Cada BFF sirve sobre TLS con su PROPIO certificado. No comparten keystore a
# proposito: son tres servicios que se despliegan por separado, y compartir la
# clave privada significaria que comprometer el cajero -el equipo expuesto en la
# calle- entrega tambien la identidad del canal web.
#
# Los certificados NO estan en el repositorio: un keystore guarda una clave
# privada, y versionarla la vuelve inutil como credencial. Se generan con
# generar_certificados.ps1, que levantar.ps1 invoca solo si faltan.
#
# ALCANCE: son autofirmados, de desarrollo. Un navegador y curl los rechazan
# salvo que se les indique confiar en ellos. En produccion irian certificados
# emitidos por una CA, o el TLS lo terminaria el balanceador, que es lo habitual
# cuando hay varios servicios detras.
server.ssl.enabled=true
server.ssl.key-store=file:./certs/bff-web.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bff-web
server.ssl.key-store-password=${BFF_KEYSTORE_PASSWORD:bffbancoxyz}

# Solo TLS 1.2 y 1.3. Las versiones anteriores tienen debilidades conocidas y no
# hay ningun cliente de este sistema que las necesite.
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# ---------------------------------------------------------------------------
# Token de este canal
# ---------------------------------------------------------------------------
# Cada BFF firma con SU PROPIA clave. Es la propiedad de seguridad central del
# diseno: un token emitido por otro canal no valida aqui, porque la firma no
# coincide y el emisor declarado tampoco. Si los tres compartieran secreto, un
# token robado del telefono -el cliente mas expuesto- serviria para operar
# contra el cajero, que es el que entrega dinero.
#
# La duracion tambien es del canal, no del mecanismo. Ver el javadoc de
# TokenService.
bank.token.emisor=web
bank.token.duracion=PT8H
bank.token.secreto=${BFF_TOKEN_SECRETO_WEB:clave-de-desarrollo-del-canal-web-cambiar-en-produccion}
