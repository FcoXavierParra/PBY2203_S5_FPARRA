# ---------------------------------------------------------------------------
# Perfil 'oracle' - la misma Autonomous Database que poblo la Experiencia 1
# ---------------------------------------------------------------------------
# Se activa con --spring.profiles.active=oracle
#
# Por que este perfil es el que muestra el patron completo
# --------------------------------------------------------
# Con el perfil por defecto cada BFF levanta su propia H2 en memoria, y eso
# tiene una consecuencia que se nota: los tres tienen COPIAS SEPARADAS de los
# datos, asi que un retiro hecho por el cajero no se ve desde la web ni desde el
# movil. Contra Oracle los tres leen la misma base y esa incoherencia desaparece.
#
# Ademas es la continuidad real con la Experiencia 1: las tablas cuenta,
# transaccion y movimiento_anual las creo y poblo el batch de Spring Batch, y
# los BFF sirven lo que aquel calculo -saldo_final con intereses aplicados, la
# marca de anomalia- en vez de recalcularlo por su cuenta.
#
# IMPORTANTE: aqui NO va ninguna credencial. Este archivo se publica en GitHub.
# Los valores se toman de variables de entorno; si falta alguna, la aplicacion
# falla al arrancar con un mensaje claro en vez de conectarse a otra cosa.
#
# En PowerShell, antes de ejecutar (comillas SIMPLES: con dobles PowerShell
# expande $variables y backticks que haya dentro de la contrasena):
#
#   $env:ORACLE_JDBC_URL = "jdbc:oracle:thin:@<servicio>_low?TNS_ADMIN=C:/oracle/wallet"
#   $env:ORACLE_USER     = "ADMIN"
#   $env:ORACLE_PASSWORD = 'la-clave'
# ---------------------------------------------------------------------------

spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool chico y con validacion: Autonomous Database corta las conexiones ociosas,
# y un BFF pasa ratos largos sin recibir peticiones.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.validation-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1 FROM DUAL

# 'validate' y no 'update': el esquema lo manda la Experiencia 1 y este proyecto
# solo lo consume. Si las entidades y las tablas dejaran de calzar, es preferible
# que la aplicacion no arranque a que Hibernate altere en silencio una tabla que
# otro proyecto escribe.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# La carga desde CSV no se ejecuta si la tabla ya tiene filas, asi que contra
# Oracle no toca nada. Se deja el flag explicito para que quede escrito.
bank.datos.cargar-si-vacio=true
